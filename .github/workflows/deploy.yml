name: Deploy new release
run-name: release ${{ github.ref_name }}

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

on:
    push:
        tags:
            - "v*" # triggers on tags like v1.0.0, v1.1.0

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0 # needed for tags

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.23

            - name: Build site
              run: go run main.go

            - name: Upload build output
              uses: actions/upload-artifact@v6
              with:
                  name: site-dist
                  path: ./dist
    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: gh-pages
                  fetch-depth: 0

            - name: Archive previous release
              if: github.ref_name != ''
              run: |
                  set -e

                  VERSION="${GITHUB_REF#refs/tags/}"

                  git config --global user.name "github-actions"
                  git config --global user.email "github-actions@github.com"

                  if [ -d dist ] && [ "$(ls -A dist)" ]; then
                    mkdir -p "archive/$VERSION"
                    mv dist "archive/$VERSION/dist"
                  fi

            - name: Download build output
              uses: actions/download-artifact@v7
              with:
                  name: site-dist
                  path: ./dist

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ./dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            - name: Commit archived and new release
              run: |
                  git add .
                  git commit -m "release ${{ github.ref_name }}" || echo "No changes to commit"
                  git push origin gh-pages
